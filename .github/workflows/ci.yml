name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run test:hosting
      - run: npm --prefix .. run content:test
      - run: node ../scripts/content-review.mjs --check
      - run: npm run validate:entrepreneurs
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build:local
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_ENABLE_DEMO_CONTENT: "false"
      - name: Verify search metadata in server-rendered HTML
        run: node scripts/check-seo.mjs
        env:
          SEO_CANONICAL_ORIGIN: http://localhost:3000
      - name: Install Chromium for isolated public-collection checks
        run: npx playwright install --with-deps chromium
      - name: Verify public collection fallback in both languages and viewport sizes
        run: npm run test:collections:browser
      - name: Verify homepage founder discovery and fresh visit mixes
        run: npm run test:founders:browser
      - name: Verify newsletter signup, confirmation and unsubscribe
        run: node scripts/check-newsletter.mjs
      - name: Verify membership registration, OTP and application screens
        run: node scripts/check-member-onboarding.mjs
      - name: Verify partner logo sources, filters and continuous rightward motion
        run: node scripts/check-partner-ecosystem.mjs
      - name: Verify admin CRM, PR, analytics and priorities
        run: node scripts/check-admin-operations.mjs
      - name: Save admin browser review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-operations-previews
          path: /tmp/admin-operations-*.png
          retention-days: 3
          if-no-files-found: ignore
      - name: Verify admin bulk activation and recipient review
        run: node scripts/check-founder-outreach.mjs
      - name: Verify country filters and responsive founder card presentation
        run: node scripts/check-founder-presentation.mjs
      - name: Save founder logo and newsletter browser previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: founder-newsletter-previews
          path: |
            /tmp/founder-logos-*.png
            /tmp/newsletter-*.png
          retention-days: 3
          if-no-files-found: ignore
      - name: Verify directory visit shuffle, bilingual name search and rightward movement
        run: node scripts/check-founder-directory-discovery.mjs
      - name: Verify bilingual global events, source links and invitation filters
        run: node scripts/check-ecosystem-calendar.mjs
      - name: Verify EO Accelerator value and cohort card layout in both languages
        run: node scripts/check-eoa-equal-cards.mjs
      - name: Verify homepage video playback and accessible fallbacks
        run: node scripts/check-home-hero.mjs
      - name: Check public pages for serious WCAG 2.1 A/AA violations (axe-core)
        run: npm run test:a11y:browser
  pnpm-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Install workspace with explicit build approvals
        run: pnpm install --frozen-lockfile
        env:
          CI: true
      - name: Verify approved native tools load
        working-directory: frontend
        run: |
          node --import tsx --input-type=module -e "import './src/lib/founder-discovery.ts'; console.log('Approved esbuild transform works')"
          pnpm run lint
      - name: Verify standalone frontend hosting install and default build
        env:
          CI: true
          # Next otherwise defaults to 63 page workers, as on the reported host.
          CIRCLE_NODE_TOTAL: 64
          NEXT_PUBLIC_SITE_URL: https://wosool.org
          NEXT_PUBLIC_API_URL: https://api.wosool.org
          NEXT_PUBLIC_ENABLE_DEMO_CONTENT: "false"
        run: |
          set -o pipefail
          standalone_frontend=$(mktemp -d)
          git archive HEAD frontend | tar -x -C "$standalone_frontend" --strip-components=1
          pnpm --dir "$standalone_frontend" install --frozen-lockfile --store-dir "$standalone_frontend/.pnpm-store"
          pnpm --dir "$standalone_frontend" exec node --import tsx --input-type=module -e "import './src/lib/founder-discovery.ts'; console.log('Standalone esbuild transform works')"
          pnpm --dir "$standalone_frontend" run lint
          pnpm --dir "$standalone_frontend" run test:hosting
          pnpm --dir "$standalone_frontend" run build | tee "$standalone_frontend/build.log"
          grep -Fq 'Collecting page data using 1 worker' "$standalone_frontend/build.log"
          grep -Fq 'Generating static pages using 1 worker' "$standalone_frontend/build.log"
          pnpm --dir "$standalone_frontend" run smoke:hosting
  production-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test deployment contract and smoke-check failure handling
        run: node --test frontend/scripts/hosting-preflight.test.mjs frontend/scripts/hosting-assets.test.mjs scripts/production-smoke.test.mjs
      - name: Verify frontend environment contract using nonsecret examples
        env:
          NEXT_PUBLIC_SITE_URL: https://wosool.org
          NEXT_PUBLIC_API_URL: https://api.wosool.org
          NEXT_PUBLIC_ENABLE_DEMO_CONTENT: "false"
        run: node frontend/scripts/hosting-preflight.mjs

  backend:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3.36', '8.4.27', '8.5.12']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, curl, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: php ../scripts/check-php-runtime.php
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check PHP syntax across application and migrations
        run: rg --files app bootstrap config database routes tests -g '*.php' -0 | xargs -0 -n1 php -l
      - run: composer audit
      - name: Install shared OpenAPI contract validator
        run: npm --prefix ../frontend ci --ignore-scripts
      - run: composer run test
        env:
          NEWSLETTER_PREVIEW_DIR: /tmp/newsletter-mail-previews
      - name: Save bilingual email template previews
        if: matrix.php == '8.5.12'
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-email-previews
          path: /tmp/newsletter-mail-previews/*.html
          retention-days: 3
          if-no-files-found: error
      - name: Verify Laravel deployment caches compile
        env:
          APP_ENV: production
          APP_DEBUG: "false"
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          # Clear generated files only. This job has no persistent database;
          # optimize:clear also flushes the database-backed application cache.
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
