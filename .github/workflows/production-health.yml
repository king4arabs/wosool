name: Production health monitoring

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wosool-production-health
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public website, accelerator, Laravel and same-origin API
        env:
          WOSOOL_EXPECTED_FRONTEND_REVISION: ${{ vars.WOSOOL_EXPECTED_FRONTEND_REVISION }}
          WOSOOL_EXPECTED_BACKEND_REVISION: ${{ vars.WOSOOL_EXPECTED_BACKEND_REVISION }}
        run: node scripts/production-smoke.mjs
